<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba Socket.io - Notificaciones</title>
</head>

<body>
  <h1>Prueba de Notificaciones</h1>

  <label>
    ID del usuario:
    <input id="idUsuario" type="number" value="1" />
  </label>

  <button id="conectar">Registrar usuario</button>

  <h2>Eventos recibidos</h2>
  <pre id="salida"></pre>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <script>
    const salida = document.getElementById('salida');

    const socket = io(
      'http://localhost:3000/notificaciones'
    );

    function mostrar(mensaje) {
      salida.textContent +=
        `[${new Date().toLocaleTimeString()}] ${mensaje}\n`;
    }

    socket.on('connect', () => {
      mostrar(`Conectado. Socket ID: ${socket.id}`);
    });

    socket.on('disconnect', () => {
      mostrar('Desconectado del servidor');
    });

    socket.on('usuarioRegistrado', (data) => {
      mostrar(
        `Usuario registrado en Socket.io: ${JSON.stringify(data)}`
      );
    });

    socket.on('nuevaNotificacion', (data) => {
      mostrar(
        `NUEVA NOTIFICACIÓN: ${JSON.stringify(data, null, 2)}`
      );
    });

    document
      .getElementById('conectar')
      .addEventListener('click', () => {
        const idUsuario = Number(
          document.getElementById('idUsuario').value
        );

        socket.emit('registrarUsuario', {
          idUsuario,
        });

        mostrar(
          `Solicitando registro del usuario ${idUsuario}...`
        );
      });
  </script>
</body>
</html>
